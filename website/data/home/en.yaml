principles:
  eyebrow: Design principles
  title: Improvement must be inspectable
  columns: 3
  items:
    - { icon: fa-solid fa-fingerprint, title: Identity before score, desc: Candidate, Dataset, Evaluation Stack, runtime and Context are fixed before comparison. }
    - { icon: fa-solid fa-ruler-combined, title: Validity before averages, desc: Invalid evidence, abstention and coverage stay distinct from raw verifier rewards. }
    - { icon: fa-solid fa-code-compare, title: One controlled change, desc: Attribution remains possible because each iteration changes one reviewed surface. }
    - { icon: fa-solid fa-shield-halved, title: Permission-aware, desc: Mutations, provider access and local execution each disclose their own boundary. }
    - { icon: fa-solid fa-file-circle-check, title: Evidence over assertion, desc: Every release claim points back to source, tests or a labeled archive. }
    - { icon: fa-solid fa-ship, title: Gate is not deployment, desc: Promotion recommendation and production authority remain deliberately separate. }

faq:
  eyebrow: Boundaries first
  title: What Harbor Self-Evolving does—and does not do
  items:
    - question: Is this CNCF Harbor, the container registry?
      answer: No. This project uses Harbor as the name of its evaluation and controlled-evolution runtime for DeepSeek Harness Agents.
      open: true
    - question: Does every completed Job improve the Agent?
      answer: No. Job completion is execution status. Valid scores, comparability, policy thresholds and the Gate decide whether promotion is recommended.
    - question: Is the Gate deterministic?
      answer: The Gate logic is deterministic for fixed inputs. Candidate and Judge model outputs can still be stochastic, so repeated Jobs may differ.
    - question: Does PROMOTE deploy anything?
      answer: No. Harbor emits evidence and a recommendation. External CI/CD or a human owner keeps deployment and Champion authority.
    - question: Is Host mode sandboxed?
      answer: No. Default Host mode provides no container isolation, user switching, network policy, or CPU/memory limits; tasks run with the current user's permissions.
    - question: Is this endorsed by DeepSeek?
      answer: No. The official Skill is maintained by this project; that does not imply endorsement by DeepSeek.

command-box:
  eyebrow: Normal installation
  title: One command, then restart DSH
  code: npx --yes dsh-harbor-evolution@latest setup --project-root "$PWD"
  lang: bash
  note: Run this from your business Agent workspace. Source installation is for contributors only.

cta:
  title: Start with evidence you already have.
  text: Evaluate recent completed Sessions, or bring an explicit Candidate and Dataset for a comparable regression.
  label: Open the quick start
  url: docs/start/
  style: primary
