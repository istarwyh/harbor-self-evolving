sections: [hero, metrics, capabilities, steps, gallery, principles, faq, command-box, cta]

hero:
  eyebrow: Harbor Self-Evolving 0.10.1 · Beta
  title_lines:
    - Make your Agent
    - improve every time.
  lead: >
    Continuous evaluation and controlled self-evolution for DeepSeek Harness.
    Diagnose real Sessions or comparable regressions, change one controlled surface at a time,
    and let a deterministic Gate return a PROMOTE or REJECT recommendation.
  note: Gate is a recommendation—not deployment. Default Host mode is not a sandbox.
  image:
    src: images/harbor-ocean.jpg
    alt: A whale rising above a lighthouse in a deep-blue harbor, the Harbor Self-Evolving brand artwork.
  media: { ratio: '1.1fr 1fr', max_width: 44rem, hide_below: md }
  actions:
    - { label: Install and start, url: docs/start/, icon: fa-solid fa-rocket, style: primary }
    - { label: Understand the product, url: product/, icon: fa-solid fa-compass, style: ghost }
  detail: { label: View source and releases on GitHub, url: 'https://github.com/istarwyh/harbor-self-evolving', external: true, icon: fa-brands fa-github }

metrics:
  eyebrow: Checkable facts
  title: A complete evaluation surface, not a magic loop
  columns: 4
  items:
    - { value: 3, label: Collaborating deliverables, desc: DSH Plugin · Skill · Python Adapter, icon: fa-solid fa-cubes }
    - { value: 19, label: Strict Agent tools, desc: 10 approval-gated writes · 9 read-only/in-memory, icon: fa-solid fa-screwdriver-wrench }
    - { value: 2, label: Evaluation paths, desc: Historical diagnosis · Candidate regression, icon: fa-solid fa-code-branch }
    - { value: 1, label: Deterministic Gate, desc: Kept separate from the Optimizer, icon: fa-solid fa-scale-balanced }

capabilities:
  eyebrow: Three deliverables, one contract
  title: Native DSH experience, Harbor-grade evidence
  desc: Each layer has a narrow responsibility and an explicit trust boundary.
  items:
    - ref: 01 / DSH PLUGIN
      title: Work where the Agent already works
      url: product/dsh-plugin/
      motto: Native tools, Workbench, context and reviewed actions
      bullets:
        - 19 strict tools cover setup, diagnosis, evaluation, governance and Gate.
        - The Web UI exposes trials, evidence, artifacts, operations and settings.
        - Mutating Agent tools require one-shot approval; read surfaces stay bounded and redacted.
      value: The Plugin connects DSH interactions to immutable Harbor evaluation identities.
      visual: { type: card, icon: fa-solid fa-window-maximize, title: DSH Workbench, lines: [Historical launcher, Candidate pipeline, Evidence viewer, Reviewed actions] }
    - ref: 02 / BUNDLED SKILL
      title: Orchestrate the workflow without hiding the boundaries
      url: product/#skill
      motto: Identify → diagnose → change once → regress → Gate
      bullets:
        - Uses recent completed Sessions when no Dataset is supplied.
        - Freezes Candidate, Dataset, Stack and Context identities before an expensive Job.
        - Never treats Gate as deployment authority.
      value: The Skill is maintained by this project; it is not DeepSeek endorsement.
      visual: { type: image, src: images/diagrams/evolution-loop.svg, alt: Controlled Agent evolution loop from evidence to one change and regression. }
    - ref: 03 / PYTHON ADAPTER
      title: Run through Harbor's evaluation model
      url: product/#adapter
      motto: Generator · Evaluator · Optimizer · Gate
      bullets:
        - Host execution is the 0.9.7 default; Docker is explicit opt-in.
        - Candidate Context v3 and Historical Context v2 remain distinct protocols.
        - Jobs record stable identities and typed evidence for later comparison.
      value: Identity and evidence become inspectable artifacts—not claims in prose.
      visual: { type: image, src: images/diagrams/system-architecture.svg, alt: DSH Plugin, Skill and Python Adapter architecture. }

steps:
  eyebrow: Two ways in
  title: Start from reality, finish with a controlled decision
  items:
    - { title: Diagnose recent Sessions, icon: fa-solid fa-clock-rotate-left, desc: 'Preview bounded, redacted DSH history; disclose the Judge and data boundary; confirm; run one Trial per selected Session.' }
    - { title: Freeze a Candidate, icon: fa-solid fa-snowflake, desc: 'Snapshot the Candidate and bind Dataset, Evaluation Stack, runtime and Context identities before regression.' }
    - { title: Change one surface, icon: fa-solid fa-sliders, desc: 'Improve the Agent or Evaluator with an explicit diff, then rerun comparable evidence.' }
    - { title: Apply the Gate, icon: fa-solid fa-scale-balanced, desc: 'PROMOTE or REJECT is a deterministic recommendation for fixed Gate inputs; external CI/CD still owns deployment.' }

