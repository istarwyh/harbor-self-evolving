principles:
  eyebrow: 设计原则
  title: 进步必须可检查
  columns: 3
  items:
    - { icon: fa-solid fa-fingerprint, title: 先身份，后分数, desc: 比较前固定 Candidate、Dataset、Evaluation Stack、runtime 与 Context。 }
    - { icon: fa-solid fa-ruler-combined, title: 先有效性，后平均值, desc: 无效证据、abstention、coverage 与 raw reward 保持区分。 }
    - { icon: fa-solid fa-code-compare, title: 一次只改一个面, desc: 每轮只有一个受审改动，才能保留归因。 }
    - { icon: fa-solid fa-shield-halved, title: 权限可见, desc: mutation、provider 访问与本地执行分别披露边界。 }
    - { icon: fa-solid fa-file-circle-check, title: 证据胜于断言, desc: 每个发布主张都回链源码、测试或带标签归档。 }
    - { icon: fa-solid fa-ship, title: Gate 不是部署, desc: 晋级建议与生产权限刻意分离。 }

faq:
  eyebrow: 先讲边界
  title: Harbor Self-Evolving 做什么，又不做什么
  items:
    - question: 这是容器镜像仓库 CNCF Harbor 吗？
      answer: 不是。本项目的 Harbor 指面向 DeepSeek Harness Agent 的评测与受控进化运行时。
      open: true
    - question: 每个完成的 Job 都会让 Agent 进步吗？
      answer: 不会。Job 完成只是执行状态；有效分数、可比性、策略阈值和 Gate 才决定是否建议晋级。
    - question: Gate 是确定性的吗？
      answer: 对固定输入，Gate 逻辑是确定性的；Candidate 与 Judge 模型输出仍可能随机，因此重复 Job 可能不同。
    - question: PROMOTE 会自动部署吗？
      answer: 不会。Harbor 产出证据与建议；外部 CI/CD 或人工 owner 保留部署与 Champion 权限。
    - question: Host 模式是沙箱吗？
      answer: 不是。默认 Host 模式不提供容器隔离、用户切换、网络策略或 CPU/内存限制，任务以当前用户权限直接运行。
    - question: 这是 DeepSeek 官方背书吗？
      answer: 不是。官方 Skill 由本项目维护，不表示 DeepSeek 官方背书。

command-box:
  eyebrow: 普通安装
  title: 一条命令，然后重启 DSH
  code: npx --yes dsh-harbor-evolution@latest setup --project-root "$PWD"
  lang: bash
  note: 请在业务 Agent 工作区运行；源码安装仅供贡献者使用。

