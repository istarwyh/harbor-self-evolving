    - { title: 冻结 Candidate, icon: fa-solid fa-snowflake, desc: '回归前固定 Candidate，并绑定 Dataset、Evaluation Stack、runtime 与 Context 身份。' }
    - { title: 只改一个受控面, icon: fa-solid fa-sliders, desc: '通过显式 diff 改进 Agent 或 Evaluator，再运行可比证据。' }
    - { title: 应用 Gate, icon: fa-solid fa-scale-balanced, desc: '对固定 Gate 输入，PROMOTE / REJECT 是确定性建议；部署仍由外部 CI/CD 决定。' }

