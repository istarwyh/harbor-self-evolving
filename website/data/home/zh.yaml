hero:
  eyebrow: Harbor Self-Evolving 0.9.7 · Beta
  title_lines:
    - 让 Agent
    - 每一次都进步。
  lead: >
    面向 DeepSeek Harness 的持续评测与受控自进化插件。固定 Candidate、Dataset、评测尺子和运行环境身份；
    从真实会话或可比回归中发现问题；一次只改变一个受控面；最后由确定性 Gate 给出 PROMOTE / REJECT 建议。
  note: Gate 是建议，不是部署。默认 Host 模式不是沙箱。
  image:
    src: images/harbor-ocean.jpg
    alt: 深蓝港湾中，鲸鱼从灯塔上方跃起的 Harbor Self-Evolving 品牌图。
  media: { ratio: '1.1fr 1fr', max_width: 44rem, hide_below: md }
  actions:
    - { label: 安装并开始, url: docs/start/, icon: fa-solid fa-rocket, style: primary }
    - { label: 了解产品, url: product/, icon: fa-solid fa-compass, style: ghost }
  detail: { label: 在 GitHub 查看源码与发布, url: 'https://github.com/istarwyh/harbor-self-evolving', external: true, icon: fa-brands fa-github }

metrics:
  eyebrow: 可核对的事实
  title: 一套完整评测面，而不是魔法循环
  columns: 4
  items:
    - { value: 3, label: 个协作交付物, desc: DSH Plugin · Skill · Python Adapter, icon: fa-solid fa-cubes }
    - { value: 19, label: 个严格 Agent 工具, desc: 10 个审批写操作 · 9 个只读/内存操作, icon: fa-solid fa-screwdriver-wrench }
    - { value: 2, label: 条评测路径, desc: Historical 诊断 · Candidate 回归, icon: fa-solid fa-code-branch }
    - { value: 1, label: 个确定性 Gate, desc: 与 Optimizer 保持分离, icon: fa-solid fa-scale-balanced }

capabilities:
  eyebrow: 三个交付物，一份契约
  title: DSH 原生体验，Harbor 级证据
  desc: 每一层都有窄职责，也都有明确的信任边界。
  items:
    - ref: 01 / DSH PLUGIN
      title: 在 Agent 已经工作的地方工作
      url: product/dsh-plugin/
      motto: 原生工具、Workbench、上下文与受审动作
      bullets:
        - 19 个严格工具覆盖安装、诊断、评测、治理与 Gate。
        - Web UI 展示 Trial、Evidence、Artifact、Operation 与 Settings。
        - Agent 侧 mutation 需要一次性批准；读取保持限量与脱敏。
      value: Plugin 把 DSH 交互连接到不可变的 Harbor 评测身份。
      visual: { type: card, icon: fa-solid fa-window-maximize, title: DSH Workbench, lines: [Historical 启动器, Candidate 流水线, Evidence 阅读器, 受审动作] }
    - ref: 02 / BUNDLED SKILL
      title: 编排流程，但不隐藏边界
      url: product/#skill
      motto: 识别 → 诊断 → 单次改动 → 回归 → Gate
      bullets:
        - 没有 Dataset 时，从最近完成的 Session 开始。
        - 昂贵 Job 前先固定 Candidate、Dataset、Stack 与 Context 身份。
        - 从不把 Gate 说成部署权限。
      value: 官方 Skill 由本项目维护，不表示 DeepSeek 官方背书。
      visual: { type: image, src: images/diagrams/evolution-loop.svg, alt: 从证据到单次改动与回归的受控 Agent 进化循环。 }
    - ref: 03 / PYTHON ADAPTER
      title: 通过 Harbor 评测模型运行
      url: product/#adapter
      motto: Generator · Evaluator · Optimizer · Gate
      bullets:
        - 0.9.7 默认 Host 执行；Docker 为显式 opt-in。
        - Candidate Context v3 与 Historical Context v2 是不同协议。
        - Job 记录稳定身份与 typed evidence，供后续比较。
      value: 身份与证据成为可检查 Artifact，而不是宣传文案。
      visual: { type: image, src: images/diagrams/system-architecture.svg, alt: DSH Plugin、Skill 与 Python Adapter 架构。 }

