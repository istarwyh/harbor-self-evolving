title: &siteTitle Harbor Self-Evolving
baseURL: https://istarwyh.github.io/harbor-self-evolving/
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: Continuous evaluation and controlled self-evolution for DeepSeek Harness Agents.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 面向 DeepSeek Harness Agent 的持续评测与受控自进化。

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS, NAVJSON]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  offline_search_index: content
  github_repo: https://github.com/istarwyh/harbor-self-evolving
  github_project_repo: https://github.com/istarwyh/harbor-self-evolving
  github_branch: main
  github_subdir: website
  logo: icons/logo.svg
  copyright:
    authors: Harbor Self-Evolving contributors
    from_year: 2025
  footer_center_info: 'Harbor Self-Evolving is independent of CNCF Harbor and is not endorsed by DeepSeek.'
  page_width: wide
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    image_zoom: true
    footer_style: slim
    theme_color: '#0b6f8f'
    theme_color_dark: '#55c7e9'

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.165.0
