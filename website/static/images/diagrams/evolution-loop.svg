<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img">
<title>Controlled evolution loop</title>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif}.t{fill:#0f172a;font-size:25px;font-weight:700}.s{fill:#64748b;font-size:13px}.n{fill:#0f172a;font-size:15px;font-weight:650}.d{fill:#475569;font-size:12px}.tag{fill:#0b6f8f;font-size:11px;font-weight:700;letter-spacing:.7px}</style>
<defs><marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker><marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker><marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".09"/></filter></defs>
<rect width="960" height="600" fill="#f8fafc"/>
<text class="t" x="48" y="52">Controlled evolution loop</text>
<text class="s" x="48" y="77">Evidence precedes change; Gate remains separate from deployment</text>
<g filter="url(#sh)"><rect x="40" y="220" width="130" height="105" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/></g>
<text class="n" x="58" y="252">Observe</text>
<text class="d" x="58" y="274">real Sessions</text>
<text class="d" x="58" y="291">or fixed Dataset</text>
<g filter="url(#sh)"><rect x="190" y="220" width="130" height="105" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/></g>
<text class="n" x="208" y="252">Freeze</text>
<text class="d" x="208" y="274">Candidate · Stack</text>
<text class="d" x="208" y="291">runtime identities</text>
<g filter="url(#sh)"><rect x="340" y="220" width="130" height="105" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/></g>
<text class="n" x="358" y="252">Evaluate</text>
<text class="d" x="358" y="274">Trials · Evidence</text>
<text class="d" x="358" y="291">validity · coverage</text>
<g filter="url(#sh)"><rect x="490" y="220" width="130" height="105" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/></g>
<text class="n" x="508" y="252">Change once</text>
<text class="d" x="508" y="274">one reviewed</text>
<text class="d" x="508" y="291">surface</text>
<g filter="url(#sh)"><rect x="640" y="220" width="130" height="105" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/></g>
<text class="n" x="658" y="252">Regress</text>
<text class="d" x="658" y="274">comparable</text>
<text class="d" x="658" y="291">Candidate Job</text>
<g filter="url(#sh)"><rect x="790" y="220" width="130" height="105" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/></g>
<text class="n" x="808" y="252">Gate</text>
<text class="d" x="808" y="274">PROMOTE / REJECT</text>
<text class="d" x="808" y="291">recommendation</text>
<path d="M170 272 L190 272 L190 272" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
<path d="M320 272 L340 272 L340 272" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
<path d="M470 272 L490 272 L490 272" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<path d="M620 272 L640 272 L640 272" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<path d="M770 272 L790 272 L790 272" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<path d="M855 325 C855 470 105 470 105 325" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<rect x="393" y="446" width="174" height="22" rx="5" fill="#f8fafc"/><text class="s" x="480" y="461" text-anchor="middle">new evidence starts the next loop</text>
<line x1="48" y1="562" x2="76" y2="562" stroke="#2563eb" stroke-width="2"/>
<text class="s" x="84" y="566">evaluation flow</text>
<line x1="198" y1="562" x2="226" y2="562" stroke="#7c3aed" stroke-width="2"/>
<text class="s" x="234" y="566">controlled feedback</text>
</svg>