<text class="s" x="738.5" y="313" text-anchor="middle">typed evidence</text>
<line x1="48" y1="562" x2="76" y2="562" stroke="#2563eb" stroke-width="2"/>
<text class="s" x="84" y="566">preview/control</text>
<line x1="198" y1="562" x2="226" y2="562" stroke="#059669" stroke-width="2"/>
<text class="s" x="234" y="566">frozen evidence</text>
