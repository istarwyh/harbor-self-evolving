schema_version: 1
stack_id: deep-research-evaluation
version: 4.0.0
components:
  integration:
    id: dsh-acp-integration
    version: 1.0.0
    entry: examples/deep-research/stack/integration.py
  renderer:
    id: research-result-renderer
    version: 1.0.0
    entry: examples/deep-research/stack/renderer.py
  evaluator:
    id: deep-research-verifier
    version: 4.0.0
    entry: examples/deep-research/stack/evaluator/evaluator.json
  rubric:
    id: deep-research-rubric
    version: 4.0.0
    entry: examples/deep-research/stack/evaluator/rubric.md
  diagnoser:
    id: deep-research-diagnoser
    version: 1.0.0
    entry: examples/deep-research/stack/diagnoser.py
  optimizer:
    id: deep-research-optimizer
    version: 1.0.0
    entry: examples/deep-research/stack/optimizer.py
  runner:
    id: harbor-runner
    version: 1.0.0
    entry: examples/deep-research/stack/runner.py
    semantic: false
  reporter:
    id: deep-research-reporter
    version: 1.0.0
    entry: examples/deep-research/stack/reporter.py
judge:
  provider: deterministic
  model: ternary-script-evaluator
  version: 4.0.0
  parameters: {}
evaluation_contract:
  contract_id: deep-research-quality
  version: 4.0.0
  primary_metric: reward
  metrics:
    - { id: reward, label: 综合得分, direction: maximize }
    - { id: response_quality, label: 回应问题, direction: maximize }
    - { id: interestingness, label: 有趣性, direction: maximize }
    - { id: citation_compliance, label: 引用规范性, direction: maximize }
  groups: []
  hard_requirements:
    - { id: input_integrity }
    - { id: agent_completed }
    - { id: integration_valid }
    - { id: renderer_valid }
    - { id: judge_completed }
    - { id: artifact_schema_valid }
